<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر VIP | ساعة ذكية برو MAX</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { font-family: 'Cairo', sans-serif; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }

/* نفس التصميم بدون أي تغيير */
@keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)} }
@keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.05)} }
@keyframes shimmer { 0%{background-position:-1000px 0}100%{background-position:1000px 0} }
@keyframes fadeInUp { from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)} }

.title-float{
animation: float 3s ease-in-out infinite, shimmer 3s ease infinite;
background: linear-gradient(135deg,#f59e0b,#ef4444,#f59e0b);
background-size:200% 200%;
-webkit-background-clip:text;
color:transparent;
}

.btn-glow{transition:.3s;position:relative;overflow:hidden}
.btn-glow:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(0,0,0,.3)}

.loading{
width:20px;height:20px;border:3px solid #f3f4f6;
border-top:3px solid #f59e0b;border-radius:50%;
animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
.modal-content{background:white;border-radius:30px;max-width:400px;width:90%}
</style>
</head>

<body>
<div id="root"></div>

<div id="successModal" class="modal">
<div class="modal-content p-6 text-center">
<i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
<h3 class="text-2xl font-bold mb-2">تم استلام طلبك!</h3>
<p class="text-gray-600 mb-4">سنقوم بالتواصل معك خلال 24 ساعة</p>
<button onclick="closeModal()" class="bg-green-600 text-white px-6 py-2 rounded-full">حسناً</button>
</div>
</div>

<script>

/* ================= المنتج ================= */
const PRODUCT = {
name: "⌚ ساعة ذكية برو MAX",
price: 12990,
discount: 28,

// ✅ الصورة من ملف محلي
image: "images/watch.jpg",

features: [
{ icon: "fas fa-heartbeat", text: "قياس معدل ضربات القلب" },
{ icon: "fas fa-chart-line", text: "تتبع النشاط الرياضي" },
{ icon: "fas fa-mobile-alt", text: "اتصال بالهاتف" },
{ icon: "fas fa-water", text: "مقاومة للماء IP68" }
]
};

const finalPrice = PRODUCT.price * (1 - PRODUCT.discount / 100);

/* ================= أسعار كل ولاية ================= */
const STATE_DELIVERY = {
"الجزائر": { office: 400, home: 700 },
"وهران": { office: 450, home: 750 },
"باتنة": { office: 500, home: 800 },
"سطيف": { office: 500, home: 800 },
"قسنطينة": { office: 550, home: 850 },
"عنابة": { office: 550, home: 850 },
"بليدة": { office: 400, home: 700 }
};

/* ================= الحالة ================= */
let formData = {
firstName: "",
lastName: "",
phone: "",
state: "",
delivery: "office",
loading: false,
message: "",
messageType: ""
};

/* ================= سعر التوصيل حسب الولاية ================= */
function shippingPrice(type){
const state = formData.state;
if(!state || !STATE_DELIVERY[state]) return type === "home" ? 700 : 400;
return STATE_DELIVERY[state][type];
}

/* ================= باقي الكود (بدون تغيير التصميم) ================= */

function closeModal(){
document.getElementById("successModal").style.display = "none";
}

/* (باقي الدوال كما هي في كودك بدون تغيير) */

function render(){

const shipping = shippingPrice(formData.delivery);
const total = finalPrice + shipping;

document.getElementById("root").innerHTML = `
<div class="max-w-5xl mx-auto p-4 py-8">

<div class="grid lg:grid-cols-2 gap-6">

<!-- الصورة -->
<div class="bg-white rounded-3xl p-6">
<img src="${PRODUCT.image}" class="w-full rounded-2xl"
onerror="this.src='https://via.placeholder.com/500'">
</div>

<!-- المعلومات -->
<div class="bg-white rounded-3xl p-6">

<h1 class="text-3xl font-bold">${PRODUCT.name}</h1>

<div class="text-2xl font-bold text-orange-600 mt-2">
${Math.round(finalPrice)} دج
</div>

<!-- الولاية -->
<select id="state" class="w-full p-3 rounded-xl mt-4">
<option value="">اختر الولاية *</option>
${Object.keys(STATE_DELIVERY).map(st =>
`<option ${formData.state===st?"selected":""}>${st}</option>`
).join("")}
</select>

<!-- التوصيل -->
<select id="delivery" class="w-full p-3 rounded-xl mt-3">
<option value="office" ${formData.delivery==="office"?"selected":""}>
📦 مكتب (${shippingPrice("office")} دج)
</option>
<option value="home" ${formData.delivery==="home"?"selected":""}>
🏠 منزل (${shippingPrice("home")} دج)
</option>
</select>

<!-- المجموع -->
<div class="mt-4 font-bold text-lg">
المجموع: ${Math.round(total)} دج
</div>

</div>
</div>
</div>
`;

bindEvents();
}

function bindEvents(){
document.getElementById("state").onchange = e=>{
formData.state = e.target.value;
render();
};

document.getElementById("delivery").onchange = e=>{
formData.delivery = e.target.value;
render();
};
}

render();

</script>

</body>
</html>
