<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر VIP</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #ffe5e5 100%);
            min-height: 100vh;
        }

        .title-float {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-glow {
            transition: 0.3s;
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
        }

        input,
        select {
            border: 2px solid #e5e7eb;
            transition: 0.3s;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .timer {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border-radius: 15px;
            padding: 12px;
        }

        .timer-number {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px;
            min-width: 60px;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script>

        // ================= المنتج =================

        const PRODUCT = {
            name: "⌚ ساعة ذكية برو MAX",
            price: 12990,
            discount: 28,
            image: "images/nassim.png",

            features: [
                {
                    icon: "fas fa-heartbeat",
                    text: "قياس ضربات القلب"
                },

                {
                    icon: "fas fa-mobile-alt",
                    text: "إشعارات الهاتف"
                },

                {
                    icon: "fas fa-water",
                    text: "مقاومة للماء"
                },

                {
                    icon: "fas fa-battery-full",
                    text: "بطارية قوية"
                }
            ]
        };

        // ================= الولايات =================

        const STATES = [

            { name: "أدرار", office: 400, home: 700 },
            { name: "الشلف", office: 400, home: 700 },
            { name: "الأغواط", office: 400, home: 700 },
            { name: "أم البواقي", office: 400, home: 700 },
            { name: "باتنة", office: 400, home: 700 },
            { name: "بجاية", office: 400, home: 700 },
            { name: "بسكرة", office: 400, home: 700 },
            { name: "بشار", office: 400, home: 700 },
            { name: "البليدة", office: 400, home: 700 },
            { name: "البويرة", office: 400, home: 700 },

            { name: "تمنراست", office: 400, home: 700 },
            { name: "تبسة", office: 400, home: 700 },
            { name: "تلمسان", office: 400, home: 700 },
            { name: "تيارت", office: 400, home: 700 },
            { name: "تيزي وزو", office: 400, home: 700 },
            { name: "الجزائر", office: 400, home: 700 },
            { name: "الجلفة", office: 400, home: 700 },
            { name: "جيجل", office: 400, home: 700 },
            { name: "سطيف", office: 400, home: 700 },
            { name: "سعيدة", office: 400, home: 700 },

            { name: "سكيكدة", office: 400, home: 700 },
            { name: "سيدي بلعباس", office: 400, home: 700 },
            { name: "عنابة", office: 400, home: 700 },
            { name: "قالمة", office: 400, home: 700 },
            { name: "قسنطينة", office: 400, home: 700 },
            { name: "المدية", office: 400, home: 700 },
            { name: "مستغانم", office: 400, home: 700 },
            { name: "المسيلة", office: 400, home: 700 },
            { name: "معسكر", office: 400, home: 700 },
            { name: "ورقلة", office: 400, home: 700 },

            { name: "وهران", office: 400, home: 700 },
            { name: "البيض", office: 400, home: 700 },
            { name: "إليزي", office: 400, home: 700 },
            { name: "برج بوعريريج", office: 400, home: 700 },
            { name: "بومرداس", office: 400, home: 700 },
            { name: "الطارف", office: 400, home: 700 },
            { name: "تندوف", office: 400, home: 700 },
            { name: "تيسمسيلت", office: 400, home: 700 },
            { name: "الوادي", office: 400, home: 700 },
            { name: "خنشلة", office: 400, home: 700 }

        ];

        // ================= البيانات =================

        let formData = {
            state: "",
            delivery: "office"
        };

        // ================= السعر =================

        const finalPrice = PRODUCT.price * (1 - PRODUCT.discount / 100);

        function shippingPrice() {

            const selectedState = STATES.find(
                state => state.name === formData.state
            );

            if (!selectedState) {
                return 0;
            }

            return formData.delivery === "home"
                ? selectedState.home
                : selectedState.office;
        }

        // ================= عرض الصفحة =================

        function render() {

            const shipping = shippingPrice();

            const total = finalPrice + shipping;

            document.getElementById("root").innerHTML = `

<div class="max-w-6xl mx-auto p-4 py-8">

<div class="bg-white/80 rounded-2xl p-3 text-center shadow mb-6 text-red-700 font-bold">
🔥 أكثر من 150 طلب هذا الأسبوع
</div>

<div class="grid lg:grid-cols-2 gap-6">

<!-- الصورة -->

<div>

<div class="bg-white rounded-3xl shadow-2xl p-6 relative overflow-hidden">

<div class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold">
-${PRODUCT.discount}% خصم
</div>

<img src="${PRODUCT.image}" class="w-full rounded-2xl">

</div>

<div class="grid grid-cols-2 gap-3 mt-4">

${PRODUCT.features.map(feature => `

<div class="bg-red-600 rounded-xl p-3 text-center text-white feature-card transition">

<i class="${feature.icon} text-2xl mb-2"></i>

<p class="text-sm">${feature.text}</p>

</div>

`).join('')}

</div>

</div>

<!-- المعلومات -->

<div class="bg-white rounded-3xl shadow-2xl p-6">

<div class="text-center">

<h1 class="text-4xl font-bold title-float mb-3">
${PRODUCT.name}
</h1>

<div class="text-5xl font-bold text-red-600">
${Math.round(finalPrice)} دج
</div>

<div class="line-through text-gray-400 mt-2">
${PRODUCT.price} دج
</div>

<div class="bg-red-100 text-red-700 text-center p-3 rounded-xl mt-4 font-bold animate-pulse">
🔥 الكمية محدودة — اطلب الآن قبل نفاد المخزون
</div>

</div>

<!-- المؤقت -->

<div class="timer mt-5">

<div class="flex justify-center gap-3">

<div class="timer-number">
<div class="text-white text-2xl font-bold">01</div>
<div class="text-xs text-white">ساعة</div>
</div>

<div class="timer-number">
<div class="text-white text-2xl font-bold">25</div>
<div class="text-xs text-white">دقيقة</div>
</div>

<div class="timer-number">
<div class="text-white text-2xl font-bold">48</div>
<div class="text-xs text-white">ثانية</div>
</div>

</div>

</div>

<!-- الفورم -->

<div class="space-y-3 mt-5">

<input type="text"
placeholder="الاسم الكامل *"
class="w-full p-3 rounded-xl">

<input type="text"
placeholder="رقم الهاتف *"
class="w-full p-3 rounded-xl">

<select id="state"
class="w-full p-3 rounded-xl">

<option value="">
اختر الولاية *
</option>

${STATES.map(state => `

<option value="${state.name}"
${formData.state === state.name ? "selected" : ""}>

${state.name}

</option>

`).join('')}

</select>

<select id="delivery"
class="w-full p-3 rounded-xl">

<option value="office"
${formData.delivery === "office" ? "selected" : ""}>

📦 توصيل للمكتب

</option>

<option value="home"
${formData.delivery === "home" ? "selected" : ""}>

🏠 توصيل للمنزل

</option>

</select>

</div>

<!-- السعر -->

<div class="bg-red-50 rounded-2xl p-4 mt-5 space-y-2">

<div class="flex justify-between">
<span>سعر المنتج:</span>
<span>${Math.round(finalPrice)} دج</span>
</div>

<div class="flex justify-between">
<span>سعر التوصيل:</span>
<span>${shipping} دج</span>
</div>

<div class="border-t pt-2 flex justify-between text-xl font-bold">
<span>المجموع:</span>
<span class="text-red-600">
${Math.round(total)} دج
</span>
</div>

</div>

<!-- الثقة -->

<div class="bg-green-50 border border-green-200 rounded-xl p-3 mt-4 text-center">

<div class="text-green-700 font-bold">
✔️ الدفع عند الاستلام
</div>

<div class="text-green-700 font-bold">
✔️ ضمان جودة المنتج
</div>

<div class="text-green-700 font-bold">
✔️ توصيل سريع إلى جميع الولايات
</div>

</div>

<!-- الزر -->

<button class="w-full mt-5 bg-gradient-to-r from-red-600 to-red-800 text-white p-4 rounded-xl btn-glow font-bold text-lg">

🛒 تأكيد الطلب الآن

</button>

<!-- خدمة الزبائن -->

<div class="mt-5 bg-red-50 border border-red-200 rounded-2xl p-4">

<div class="flex items-center gap-3 mb-2">

<i class="fas fa-headset text-red-600 text-2xl"></i>

<div>

<h3 class="font-bold text-red-700">
مصلحة الزبائن
</h3>

<p class="text-gray-600 text-sm">
متواجدون للرد على جميع استفساراتكم
</p>

</div>

</div>

<a href="tel:0659418701"
class="block text-center bg-red-600 hover:bg-red-700 transition text-white py-3 rounded-xl font-bold mt-3">

📞 0659418701

</a>

</div>

<!-- الضمانات -->

<div class="flex justify-around mt-6 text-center text-sm text-gray-500">

<div>
<i class="fas fa-truck text-red-600"></i>
<span>توصيل سريع</span>
</div>

<div>
<i class="fas fa-credit-card text-red-600"></i>
<span>الدفع عند الاستلام</span>
</div>

<div>
<i class="fas fa-shield-alt text-red-600"></i>
<span>ضمان المنتج</span>
</div>

</div>

</div>

</div>

</div>
`;

            // تحديث السعر

            document.getElementById("state").onchange = function (e) {
                formData.state = e.target.value;
                render();
            };

            document.getElementById("delivery").onchange = function (e) {
                formData.delivery = e.target.value;
                render();
            };

        }

        render();

    </script>

</body>

</html>
