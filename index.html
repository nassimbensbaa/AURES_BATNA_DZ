<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر VIP</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #ffe5e5 100%);
            min-height: 100vh;
        }

        .title-float {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-glow {
            transition: 0.3s;
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
        }

        input,
        select {
            border: 2px solid #e5e7eb;
            transition: 0.3s;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .timer {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border-radius: 15px;
            padding: 12px;
        }

        .timer-number {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px;
            min-width: 60px;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script>

// ================= المنتج =================

const PRODUCT = {
    name: "⌚ ساعة ذكية برو MAX",
    price: 12990,
    discount: 28,
    image: "images/nassim.png",
    features: [
        { icon: "fas fa-heartbeat", text: "قياس ضربات القلب" },
        { icon: "fas fa-mobile-alt", text: "إشعارات الهاتف" },
        { icon: "fas fa-water", text: "مقاومة الماء" },
        { icon: "fas fa-battery-full", text: "بطارية قوية" }
    ]
};

// ================= الولايات =================

const STATES = [
    { name: "الجزائر", office: 400, home: 700 },
    { name: "وهران", office: 400, home: 700 },
    { name: "قسنطينة", office: 400, home: 700 },
    { name: "سطيف", office: 400, home: 700 },
    { name: "باتنة", office: 400, home: 700 },
    { name: "بليدة", office: 400, home: 700 }
];

// ================= الحالة =================

let formData = {
    firstName: "",
    lastName: "",
    phone: "",
    state: "",
    delivery: "office"
};

const finalPrice = PRODUCT.price * (1 - PRODUCT.discount / 100);

// ================= حساب التوصيل =================

function shippingPrice() {
    const selected = STATES.find(s => s.name === formData.state);
    if (!selected) return 0;
    return formData.delivery === "home"
        ? selected.home
        : selected.office;
}

// ================= العرض =================

function render() {

    const shipping = shippingPrice();
    const total = finalPrice + shipping;

    document.getElementById("root").innerHTML = `

<div class="max-w-6xl mx-auto p-4 py-8">

<div class="bg-white/80 rounded-2xl p-3 text-center shadow mb-6 text-red-700 font-bold">
🔥 عرض خاص لفترة محدودة
</div>

<div class="grid lg:grid-cols-2 gap-6">

<!-- الصورة -->
<div>

<div class="bg-white rounded-3xl shadow-2xl p-6 relative overflow-hidden">

<div class="absolute top-4 right-4 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold">
-${PRODUCT.discount}% خصم
</div>

<img src="${PRODUCT.image}" class="w-full rounded-2xl">

</div>

</div>

<!-- المعلومات -->
<div class="bg-white rounded-3xl shadow-2xl p-6">

<h1 class="text-3xl font-bold title-float text-center mb-4">
${PRODUCT.name}
</h1>

<div class="text-center text-4xl font-bold text-red-600">
${Math.round(finalPrice)} دج
</div>

<div class="text-center line-through text-gray-400">
${PRODUCT.price} دج
</div>

<!-- الفورم -->
<div class="space-y-3 mt-5">

<input id="firstName" placeholder="الاسم *" value="${formData.firstName}" class="w-full p-3 rounded-xl">

<input id="lastName" placeholder="اللقب *" value="${formData.lastName}" class="w-full p-3 rounded-xl">

<input id="phone" placeholder="رقم الهاتف *" value="${formData.phone}" class="w-full p-3 rounded-xl">

<select id="state" class="w-full p-3 rounded-xl">
<option value="">اختر الولاية</option>

${STATES.map(s => `
<option value="${s.name}" ${formData.state === s.name ? "selected" : ""}>
${s.name}
</option>
`).join('')}

</select>

<select id="delivery" class="w-full p-3 rounded-xl">
<option value="office" ${formData.delivery === "office" ? "selected" : ""}>توصيل للمكتب</option>
<option value="home" ${formData.delivery === "home" ? "selected" : ""}>توصيل للمنزل</option>
</select>

</div>

<!-- المجموع -->
<div class="bg-red-50 p-4 rounded-xl mt-4">

<div class="flex justify-between">
<span>المنتج</span>
<span>${Math.round(finalPrice)} دج</span>
</div>

<div class="flex justify-between">
<span>التوصيل</span>
<span>${shipping} دج</span>
</div>

<div class="flex justify-between font-bold text-lg border-t mt-2 pt-2">
<span>المجموع</span>
<span class="text-red-600">${Math.round(total)} دج</span>
</div>

</div>

<!-- زر -->
<button id="orderBtn"
class="w-full mt-5 bg-red-600 text-white p-4 rounded-xl font-bold btn-glow">
🛒 تأكيد الطلب
</button>

<!-- الزبائن -->
<div class="mt-5 bg-red-50 p-4 rounded-xl text-center">

<div class="font-bold text-red-700">مصلحة الزبائن</div>
<a href="tel:0659418701" class="text-red-600 font-bold">
📞 0659418701
</a>

</div>

</div>

</div>

</div>

`;

    // ================= حفظ البيانات بدون مسح =================

    document.getElementById("firstName").oninput = (e) => {
        formData.firstName = e.target.value;
    };

    document.getElementById("lastName").oninput = (e) => {
        formData.lastName = e.target.value;
    };

    document.getElementById("phone").oninput = (e) => {
        formData.phone = e.target.value;
    };

    document.getElementById("state").onchange = (e) => {
        formData.state = e.target.value;
        render();
    };

    document.getElementById("delivery").onchange = (e) => {
        formData.delivery = e.target.value;
        render();
    };

    document.getElementById("orderBtn").onclick = submitOrder;
}

// ================= إرسال الطلب =================

async function submitOrder() {

    if (!formData.firstName) return alert("أدخل الاسم");
    if (!formData.lastName) return alert("أدخل اللقب");
    if (!formData.phone) return alert("أدخل الهاتف");
    if (!formData.state) return alert("اختر الولاية");

    const phoneRegex = /^(05|06|07)[0-9]{8}$/;
    if (!phoneRegex.test(formData.phone)) return alert("رقم غير صحيح");

    const shipping = shippingPrice();
    const total = finalPrice + shipping;

    const btn = document.getElementById("orderBtn");
    btn.innerHTML = "جاري الإرسال...";
    btn.disabled = true;

    try {

        const res = await fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                firstName: formData.firstName,
                lastName: formData.lastName,
                phone: formData.phone,
                state: formData.state,
                deliveryType: formData.delivery,
                shipping,
                total,
                productName: PRODUCT.name
            })
        });

        const data = await res.json();

        if (data.ok) {
            alert("تم إرسال الطلب");
        } else {
            alert("فشل الإرسال");
        }

    } catch (e) {
        alert("خطأ في الاتصال");
    }

    btn.innerHTML = "🛒 تأكيد الطلب";
    btn.disabled = false;
}

render();

</script>

</body>
</html>
